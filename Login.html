<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Individual-Login</title>
    <style>
    fieldset{
        width: 500px;
        padding: 12px;
        margin: auto;
        border: 1px solid black;
    }
    </style>
</head>
<body>
    <fieldset>
    <legend align="center" >Individual-Login</legend>
    First Name:<input type="text" placeholder="Your Name">
    Last Name:<input type="text" placeholder="Surname"><br>
    Gender:<input type="radio" name="gender" value="male">Male
    <input type="radio" name="gender" value="female">Female
    <input type="radio" name="gender" value="Other">Other <br>
    Address:<input type="text" placeholder="Your Address"><br>
    State:
    <select>
        <option>Province No.1</option>
        <option>Province No.2</option>
        <option>Province No.3</option>
        <option>Province No.4</option>
    </select>
    District:
    <select>
        <option>Kathmandu</option>
         <option>Lalitpur</option>
          <option>Jankpur</option>
    </select><br>
    Interested Subject:
    <input type="checkbox" name="c" value="c">C
     <input type="checkbox" name="c++" value="c++">C++
      <input type="checkbox" name="wpt" value="wpt">WPT
       <input type="checkbox" name="vp" value="vp">VP <br>
       Favourite Sports:
       <select>
        <option>Football</option>
        <option>Vollyball</option>
        <option>cricket</option>
       </select><br>
       Email ID:<input type="text" placeholder="Example.com"><br>
       Password:<input type="text" ><br>
       Comment:<br><textarea name="comment" rows="5" cols="30"></textarea><br>
       <input type="submit" value="Submit">
        <input type="reset" value="Resest">
</fieldset>
</body>
</html>
