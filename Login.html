<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Individual Login</title>
    <style>
        fieldset {
            width: 500px;
            padding: 15px;
            margin: auto;
            border: 1px solid black;
        }
        legend {
            text-align: center;
            font-weight: bold;
        }
        label {
            display: inline-block;
            width: 120px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<form>
    <fieldset>
        <legend>Individual Login</legend>

        <label>First Name:</label>
        <input type="text" name="firstname" placeholder="Your Name"><br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
        <label>Last Name:</label>
        <input type="text" name="lastname" placeholder="Surname"><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <input type="radio" name="gender" value="other"> Other<br>

        <label>Address:</label>
        <input type="text" name="address" placeholder="Your Address"><br>

        <label>State:</label>
        <select name="state">
            <option>Province No.1</option>
            <option>Province No.2</option>
            <option>Province No.3</option>
            <option>Province No.4</option>
        </select><br>

        <label>District:</label>
        <select name="district">
            <option>Kathmandu</option>
            <option>Lalitpur</option>
            <option>Janakpur</option>
        </select><br>

        <label>Subjects:</label>
        <input type="checkbox" name="subject[]" value="C"> C
        <input type="checkbox" name="subject[]" value="C++"> C++
        <input type="checkbox" name="subject[]" value="WPT"> WPT
        <input type="checkbox" name="subject[]" value="VP"> VP<br>

        <label>Sports:</label>
        <select name="sports">
            <option>Football</option>
            <option>Volleyball</option>
            <option>Cricket</option>
        </select><br>

        <label>Email:</label>
        <input type="email" name="email" placeholder="example@email.com"><br>

        <label>Password:</label>
        <input type="password" name="password"><br>

        <label>Comment:</label><br>
        <textarea name="comment" rows="5" cols="40"></textarea><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </fieldset>
</form>

</body>
</html>
