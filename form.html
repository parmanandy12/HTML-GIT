<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form-Student</title>
</head>
<body>
    <form action="formdata.html" method="get">
        <fieldset>
           <legend align="center"><u>Form-student</u></legend>
        <label>Name:</label>
        <input type="text" name="name" size="30" maxlength="30"><br><br>
        <label>Password:</label>
        <input type="password" name="password" size="30" maxlength="30"><br><br>
        <label>Email:</label>
        <input type="email" name="email" size="30" maxlength="30"></input><br>
         <label>Gender:</label>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female<br><br>
        <label>Submit Button:<button type="submit">Submit</button></label>
    </form>
</body>
</html>
