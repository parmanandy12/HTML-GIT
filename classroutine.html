<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Routine</title>
</head>
<body>
    <form action="routine.html" method="get">
        <h3 align="center">Class Routine</h3>
        <table border="1" align="center" cellpadding="20" cellspacing="0">
            <tr>
                <th>Day</th>
                <th>Class</th>
                <th>Time</th>
            </tr>
            <tr>
                <td>Sunday</td>
                <td>Web</td>
                <td>2 hrs.</td>
            </tr>
            <tr>
                <td>Monday</td>
                <td>Digital logic</td>
                <td>1 hrs.</td>
            </tr>
            <tr>
                <td>Tuesday</td>
                <td>Distributed</td>
                <td>2 hrs.</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>Math</td>
                <td>3 hrs.</td>
            </tr>
            <tr>
                <td>Thursday</td>
                <td>Science</td>
                <td>1 hrs.</td>
            </tr>
            <tr>
                <td>Friday</td>
                <td>Nepali</td>
                <td>2 hrs.</td>
            </tr>
            <tr>
                <td>Saturday</td>
                <td colspan="2" align="center">Holiday</td>
        </table>
    </form>
</body>
</html>
