<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
    <style>
        fieldset {
            width: 500px;
            padding: 15px;
            margin: auto;
            border: 1px solid black;
        }
        legend {
            text-align: center;
            font-weight: bold;
        }
        label {
            display: inline-block;
            width: 100px;


        }
    </style>
</head>
<body>

<table>

    <form action="formdata.html" method="get">
    
        <legend><u>Student Form</u></legend>

        <label>Name:</label>
        <input type="text" name="name" size="30" maxlength="30"><br><br>

        <label>Roll No:</label>
        <input type="text" name="rollno" size="30" maxlength="30"><br><br>

        <label>Year:</label>
        <input type="text" name="year" size="30" maxlength="30"><br><br>

        <label>Faculty:</label>
        <input type="text" name="faculty" size="30" maxlength="30"><br><br>

        <label>Email:</label>
        <input type="email" name="email" size="30"><br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <input type="radio" name="gender" value="Other">Other<br><br>

        <label>Hobbies:</label>
        <input type="checkbox" name="hobbies[]" value="reading"> Reading
        <input type="checkbox" name="hobbies[]" value="traveling"> Traveling
        <input type="checkbox" name="hobbies[]" value="sports"> Sports<br><br>

        <label>Comment:</label><br>
        <textarea name="comment" rows="5" cols="35"></textarea><br><br>


        <input type="submit" value="Submit">

        <input type="reset" value="Reset">
    </fieldset>
</form>
</table>



</body>
</html>
